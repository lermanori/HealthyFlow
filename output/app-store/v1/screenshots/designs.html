<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthyFlow App Store Screenshots</title>
  <style>
    :root {
      --ink: #fffaf2;
      --forest: #102c27;
      --sage: #628f7d;
      --mint: #b7d5c6;
      --cream: #f2ddbc;
      --frame: #0b0b0d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #10241f;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    .stage {
      position: relative;
      width: 1320px;
      height: 2868px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% 52%, rgba(183, 213, 198, .84), transparent 38%),
        radial-gradient(circle at 78% 106%, rgba(242, 221, 188, .98), transparent 43%),
        linear-gradient(145deg, var(--forest) 0%, #285347 29%, var(--sage) 62%, var(--cream) 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.14), transparent 30%, transparent 78%, rgba(20,45,38,.05));
      pointer-events: none;
      z-index: 8;
    }

    .brand {
      position: absolute;
      z-index: 12;
      top: 128px;
      left: 110px;
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 62px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -2px;
    }

    .brand img {
      width: 94px;
      height: 94px;
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(0,0,0,.22);
    }

    .headline {
      position: absolute;
      z-index: 12;
      margin: 0;
      font-size: 112px;
      line-height: .98;
      font-weight: 780;
      letter-spacing: -6px;
      text-wrap: balance;
      text-shadow: 0 7px 28px rgba(8, 35, 28, .20);
    }

    .feature .headline {
      top: 120px;
      left: 90px;
      width: 1140px;
      text-align: center;
    }

    .hero .headline {
      left: 105px;
      bottom: 116px;
      width: 1110px;
      font-size: 122px;
    }

    .phone {
      position: absolute;
      z-index: 4;
      background: linear-gradient(135deg, #25262a, #050506 38%, #3e4045 72%, #09090a);
      border: 12px solid rgba(242, 242, 247, .72);
      border-radius: 92px;
      padding: 20px;
      box-shadow:
        0 62px 110px rgba(8, 38, 30, .38),
        0 12px 28px rgba(0,0,0,.34),
        inset 0 0 0 5px rgba(255,255,255,.12);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 62px;
      background: #faf8f3;
    }

    .phone-screen img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero .phone {
      top: 390px;
      left: 203px;
      width: 905px;
      height: 1968px;
      transform: rotate(-8deg);
    }

    .feature .phone {
      top: 530px;
      left: 125px;
      width: 1070px;
      height: 2350px;
    }

    .talk .phone {
      top: 560px;
      height: 1810px;
    }

    .talk .phone-screen img {
      width: 112%;
      transform: translate(-5.5%, -25px);
    }

    .eyebrow {
      display: block;
      margin-bottom: 30px;
      color: rgba(255,250,242,.72);
      font-size: 34px;
      line-height: 1;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .preview {
      min-height: 100vh;
      padding: 70px;
      display: grid;
      grid-template-columns: repeat(5, 317px);
      gap: 26px;
      align-items: start;
      justify-content: center;
      background: #eee9e4;
    }

    .preview .thumb {
      width: 317px;
      height: 689px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(33, 20, 36, .20);
    }

    .preview .stage {
      transform: scale(.24);
      transform-origin: top left;
    }

    body:not(.preview) .thumb { width: 1320px; height: 2868px; }
    body:not(.preview) .thumb:not(.active) { display: none; }

    body.store-65 {
      width: 1242px;
      height: 2688px;
      overflow: hidden;
    }

    body.store-65 .thumb {
      transform: scale(.9409090909, .9372384937);
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="thumb" data-shot="1">
    <section class="stage hero">
      <div class="brand">
        <img src="../../../../public/icons/icon-light-512x512.png" alt="">
        <span>HealthyFlow</span>
      </div>
      <div class="phone"><div class="phone-screen"><img src="raw/01-today.png" alt="HealthyFlow Today screen"></div></div>
      <h1 class="headline"><span class="eyebrow">Plan less. Know more.</span>Your whole day.<br>One place.</h1>
    </section>
  </div>

  <div class="thumb" data-shot="2">
    <section class="stage feature talk">
      <h1 class="headline">Talk it through.<br>Plan your day.</h1>
      <div class="phone"><div class="phone-screen"><img src="raw/02-talk.png" alt="HealthyFlow Talk screen"></div></div>
    </section>
  </div>

  <div class="thumb" data-shot="3">
    <section class="stage feature">
      <h1 class="headline">Everything health.<br>One daily view.</h1>
      <div class="phone"><div class="phone-screen"><img src="raw/03-health.png" alt="HealthyFlow Health overview"></div></div>
    </section>
  </div>

  <div class="thumb" data-shot="4">
    <section class="stage feature">
      <h1 class="headline">Food fits<br>into your day.</h1>
      <div class="phone"><div class="phone-screen"><img src="raw/04-nutrition.png" alt="HealthyFlow Nutrition screen"></div></div>
    </section>
  </div>

  <div class="thumb" data-shot="5">
    <section class="stage feature">
      <h1 class="headline">Make time<br>to feel stronger.</h1>
      <div class="phone"><div class="phone-screen"><img src="raw/05-workouts.png" alt="HealthyFlow Workouts screen"></div></div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const shot = params.get('shot') || 'all';
    if (params.get('size') === '65') document.body.classList.add('store-65');
    if (shot === 'all') {
      document.body.classList.add('preview');
    } else {
      document.querySelector(`[data-shot="${shot}"]`)?.classList.add('active');
    }
  </script>
</body>
</html>
