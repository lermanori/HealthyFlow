<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon: 2a "Core" mark, ink tile on dark, paper tile on light -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HealthyFlow - Smart Daily Planner</title>
    <meta name="theme-color" content="#16181C" />
    
    <!-- Apply saved theme before render to avoid flash-of-wrong-theme -->
    <script>
      (function () {
        var t = localStorage.getItem('hf-theme');
        if (t === 'white') {
          document.documentElement.setAttribute('data-theme', 'white');
        }
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', t === 'white' ? '#F7F5F0' : '#16181C');
      })();
    </script>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Plan tasks, habits, health, and workouts in one calm daily workspace." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HealthyFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-light-180x180.png" media="(prefers-color-scheme: light)" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/icons/icon-192x192.png" as="image" />
    
    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        background: #16181C;
      }

      body {
        background: #16181C;
      }

      html[data-theme='white'],
      html[data-theme='white'] body {
        background: #F7F5F0;
      }
      
      /* Prevent pull-to-refresh */
      body {
        overscroll-behavior-y: contain;
      }
      
      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #16181C;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 160ms ease-out;
      }

      html[data-theme='white'] #loading-screen {
        background: #F7F5F0;
      }
      
      /* Brand mark, duplicated from src/components/AppMark.tsx because the splash
         renders before React mounts. The --mark-* tokens in src/index.css load
         with the bundle, i.e. too late, so the colours are literals here and the
         two copies must be kept in step. */
      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        --mark-tile: #1a1917;
        --mark-ring: #46655a;
        --mark-arc: #f7f5f0;
        --mark-dot: #e4ede7;
      }

      html[data-theme='white'] .loading-logo {
        --mark-tile: #f7f5f0;
        --mark-ring: #e4ede7;
        --mark-arc: #1a1917;
        --mark-dot: #46655a;
      }
      
      .loading-text {
        color: #F2F3F5;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      
      .loading-subtitle {
        color: #878E99;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        margin-bottom: 30px;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(169, 199, 182, 0.22);
        border-top: 3px solid #A9C7B6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      html[data-theme='white'] .loading-text {
        color: #1A1917;
      }

      html[data-theme='white'] .loading-subtitle {
        color: #6B675C;
      }

      html[data-theme='white'] .loading-spinner {
        border-color: rgba(70, 101, 90, 0.18);
        border-top-color: #46655A;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-screen {
          transition: none;
        }

        .loading-spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading HealthyFlow">
      <svg class="loading-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="512" height="512" rx="113" ry="113" fill="var(--mark-tile)"/>
        <circle cx="256" cy="256" r="96" fill="none" stroke="var(--mark-ring)" stroke-width="30"/>
        <path d="M 289.9 120.1 A 140 140 0 1 1 222.1 120.2" fill="none" stroke="var(--mark-arc)" stroke-width="30" stroke-linecap="round"/>
        <circle cx="256" cy="256" r="42" fill="var(--mark-dot)"/>
      </svg>
      <div class="loading-text">HealthyFlow</div>
      <div class="loading-subtitle">Plan your day. Track what matters.</div>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 180);
          }
        }, 80);
      });

      // Handle app shortcuts
      if ('navigator' in window && 'setAppBadge' in navigator) {
        // Set app badge for unread notifications
        navigator.setAppBadge(0);
      }
      
      // Handle app installation
      window.addEventListener('appinstalled', (evt) => {
        console.log('App was installed');
        // Track installation analytics
        if ('gtag' in window) {
          gtag('event', 'app_installed', {
            event_category: 'PWA',
            event_label: 'HealthyFlow'
          });
        }
      });
      
      // Handle online/offline status
      window.addEventListener('online', () => {
        console.log('App is online');
        document.body.classList.remove('offline');
      });
      
      window.addEventListener('offline', () => {
        console.log('App is offline');
        document.body.classList.add('offline');
      });
      
      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', () => {
          setTimeout(() => {
            const perfData = performance.getEntriesByType('navigation')[0];
            console.log('Page load time:', perfData.loadEventEnd - perfData.loadEventStart);
          }, 0);
        });
      }
    </script>
  </body>
</html>
