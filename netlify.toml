[build]
  command = "npm run build"
  publish = "dist"

# Marketing page owns the root. Ad traffic must not land on a login form.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# The React app lives under /app; BrowserRouter uses basename="/app".
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Legacy public routes. These must be real 301 redirects, NOT 200 rewrites:
# with basename="/app" the router ignores any URL outside /app, so serving
# index.html at /demo would render a blank page.
[[redirects]]
  from = "/demo"
  to = "/app/demo"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/app/privacy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/app/terms"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
